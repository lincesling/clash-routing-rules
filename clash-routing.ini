custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|台灣|\bTW\b|taiwan|taipei|hinet)`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|东京|東京|大阪|\bJP\b|japan|tokyo|osaka|nrt|hnd|kix)`https://www.gstatic.com/generate_204`300,5,50
